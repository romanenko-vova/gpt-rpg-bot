[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = [".venv", "env", "cache", "images"]

[tool.ruff.lint]
# E4 и I — импорты, F — явные ошибки вроде неиспользуемых импортов
select = ["E4", "E7", "E9", "F", "I"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["config", "db", "handlers", "services"]
